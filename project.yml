name: LumenTray
options:
  bundleIdPrefix: com.lumentray
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  Alamofire:
    url: https://github.com/wrandecima-bit/Alamofire
    branch: master
targets:
  LumenTray:
    type: application
    platform: iOS
    sources:
      - path: LumenTray
    dependencies:
      - package: Alamofire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumentray.glass
        PRODUCT_NAME: LumenTray
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LumenTray
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_NSCameraUsageDescription: LumenTray lifts a food barcode through the glass pane so a slot can be filled.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        ENABLE_TESTABILITY: YES
  LumenTrayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LumenTrayTests
    dependencies:
      - target: LumenTray
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumentray.glass.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LumenTray.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LumenTray"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
schemes:
  LumenTray:
    build:
      targets:
        LumenTray: all
        LumenTrayTests: [test]
    test:
      targets:
        - LumenTrayTests
